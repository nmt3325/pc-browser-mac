name: Runner diagnostic (manual)
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - run: uname -a && sw_vers 2>/dev/null || true
