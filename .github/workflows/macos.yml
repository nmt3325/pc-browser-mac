name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run synthetic unit tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --jobs 2 2>&1 | tee unit-tests.log
      - name: Build signed app bundle
        shell: bash
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF_TYPE" == tag ]]; then
            export APP_VERSION="${BUILD_REF_NAME#v}"
          fi
          bash scripts/build-app.sh
      - name: Verify extracted package and generate downloads
        shell: bash
        env:
          PCB_GUI_EVIDENCE_DIR: ${{ github.workspace }}/ci-gui
          PCB_REQUIRE_GUI_CHECK: '1'
        run: bash scripts/package-app.sh
      - name: Upload app, source, checksums and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PC-Browser-Mac-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload GUI self-check evidence (generated test pattern only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-${{ github.run_number }}
          path: ci-gui/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test log even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-log-${{ github.run_number }}
          path: unit-tests.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish version-tagged build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PC-Browser-Mac-arm64-${{ github.run_number }}
          path: dist
      - name: Create release without overwriting an existing one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag \
            --target "$SOURCE_COMMIT" --title "PC Browser Mac ${TAG#v}" \
            --notes-file RELEASE-NOTES.txt "${flags[@]}" \
            ./*.zip SHA256SUMS build-metadata.json ci-smoke.json
