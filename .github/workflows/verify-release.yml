name: Verify a published release (manual)

# Downloads the published assets of one release and checks them on GitHub-hosted macOS machines of different OS versions:
# SHA256SUMS, signature, architecture, minimum OS, and the packaged app's CLI and GUI smoke checks on generated test-pattern data.
# It never builds the app: what runs is exactly what a user downloads.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify, for example v0.2.0-beta.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS 14 arm64
            runner: macos-14
            slug: macos14-arm64
          - label: macOS 15 arm64
            runner: macos-15
            slug: macos15-arm64
    steps:
      - name: Check out the tagged source (test scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Record the machine
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          python3 --version
      - name: Download the published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          ls -l release
      - name: Verify the assets and run the packaged app's smoke checks
        shell: bash
        env:
          PCB_GUI_EVIDENCE_DIR: ${{ github.workspace }}/verify-gui
          PCB_REQUIRE_GUI_CHECK: '1'
        run: bash scripts/verify-release.sh release verify-release.json
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-release-${{ matrix.slug }}-${{ github.run_number }}
          path: |
            verify-release.json
            verify-gui/
          if-no-files-found: ignore
          retention-days: 30
